name: clickbattle
description: A competitive two-player tapping game.
publish_to: 'none'
version: 2.0.6+28  # Updated version code and build number

environment:
  sdk: '>=3.0.0 <4.0.0'

# Specify supported platforms
flutter:
  platforms:
    android: true
    ios: false
    web: false
    windows: false
    macos: false
    linux: false

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  just_audio: ^0.9.36
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  in_app_review: ^2.0.8
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - lib/assets/app-icon.jpg
    - lib/assets/audio/bg-music.mp3

