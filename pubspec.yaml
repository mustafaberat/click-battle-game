name: clickbattle
description: A competitive two-player tapping game.
publish_to: 'none'
version: 4.0.0+36

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.9.37
  shared_preferences: ^2.2.3
  provider: ^6.1.2
  in_app_review: ^2.0.9
  google_mobile_ads: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - lib/assets/app-icon.jpg
    - lib/assets/audio/bg-music.mp3

